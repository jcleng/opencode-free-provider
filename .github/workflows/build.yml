on:
  repository_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      arg_name:
        description: '镜像标签, 例如 opencode-free-provider:latest'
        required: true
        default: 'opencode-free-provider:latest'
      arg_registry:
        description: '镜像仓库地址 (ghcr.io / 其它 registry)'
        required: true
        default: 'ghcr.io'
      arg_user:
        description: '镜像仓库用户名'
        required: true
        default: 'jcleng'

name: build images && push
jobs:
  buildimages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ github.event.inputs.arg_registry || 'ghcr.io' }}
        username: ${{ github.event.inputs.arg_user || github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: false

    - name: Build image
      run: |
        IMAGE="${{ github.event.inputs.arg_registry || 'ghcr.io' }}/${{ github.event.inputs.arg_user || github.actor }}/${{ github.event.inputs.arg_name || 'opencode-free-provider:latest' }}"
        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        docker build . -t "$IMAGE"

    - name: Push image
      run: |
        docker push "$IMAGE"
