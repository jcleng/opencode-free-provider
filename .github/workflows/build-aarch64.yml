# 单架构 aarch64 镜像的按需构建入口。
#
# 常规发布走 build.yml —— 它一次构建 linux/amd64 + linux/arm64 并推送多架构
# manifest list, `docker pull …:latest` 会按本机架构自动选择。
#
# 本 workflow 只用于需要「独立的 arm64 单架构标签」的场景 (例如给
# 只认单架构 manifest 的老 registry / 老 docker 使用, 或调试 arm64 产物),
# 因此**不监听 push**, 只能手动触发, 避免与 build.yml 争用同一个 latest 标签。
on:
  workflow_dispatch:
    inputs:
      arg_name:
        description: '镜像标签, 例如 opencode-free-provider:latest'
        required: true
        default: 'opencode-free-provider:latest'
      arg_registry:
        description: '镜像仓库地址 (ghcr.io / 其它 registry)'
        required: true
        default: 'ghcr.io'
      arg_user:
        description: '镜像仓库用户名'
        required: true
        default: 'jcleng'
      arg_suffix:
        description: '追加到镜像标签后的架构后缀'
        required: true
        default: '-aarch64'

name: build aarch64 image && push (manual)
jobs:
  buildimages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Repos
      uses: actions/checkout@v4

    # 按 https://github.com/jirutka/setup-alpine#set-up-and-use-alpine-for-a-different-cpu-architecture
    # 使用 arch: aarch64 准备 aarch64 的 Alpine chroot 模拟环境。
    #
    # 注意：不使用 `uses: jirutka/setup-alpine@v1`，因为其 composite step 执行的是
    # `sudo -E ./setup-alpine.sh`；runner 的 sudo 会忽略 -E
    # ("sudo: preserving the entire environment is not supported, '-E' is ignored")，
    # 导致 INPUT_* 变量丢失并在 `set -u` 下报 unbound variable。
    # 这里 clone 同一份 action 源码（脚本需用到其 keys/、binfmts/、alpine.sh 等），
    # 并用 `sudo env` 显式传入全部 INPUT_* 参数。
    - name: Set up Alpine Linux for aarch64 (QEMU emulation)
      run: |
        git clone --depth 1 --branch v1 https://github.com/jirutka/setup-alpine.git "$RUNNER_TEMP/setup-alpine"
        sudo env \
          SUDO_USER="$USER" SUDO_UID="$(id -u)" SUDO_GID="$(id -g)" \
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
          GITHUB_OUTPUT="$GITHUB_OUTPUT" \
          GITHUB_PATH="$GITHUB_PATH" \
          RUNNER_TEMP="$RUNNER_TEMP" \
          INPUT_APK_TOOLS_URL='https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/x86_64/apk.static#!sha256!34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c' \
          INPUT_ARCH='aarch64' \
          INPUT_BRANCH='latest-stable' \
          INPUT_EXTRA_KEYS='' \
          INPUT_EXTRA_REPOSITORIES='' \
          INPUT_MIRROR_URL='http://dl-cdn.alpinelinux.org/alpine' \
          INPUT_PACKAGES='' \
          INPUT_SHELL_NAME='alpine.sh' \
          INPUT_VOLUMES='' \
          bash "$RUNNER_TEMP/setup-alpine/setup-alpine.sh"

        # 作为 composite action 时 GITHUB_OUTPUT/GITHUB_PATH 由 runner 设置；
        # 直接调用脚本时需要手动把 chroot 的 abin 加入 PATH。
        ROOTFS=$(sed -n 's/^root-path=//p' "$GITHUB_OUTPUT" | tail -1)
        echo "$ROOTFS/abin" >> "$GITHUB_PATH"
        echo "ALPINE_ROOT_PATH=$ROOTFS" >> "$GITHUB_ENV"

    - name: Verify aarch64 emulation
      run: uname -m
      shell: alpine.sh {0}

    # setup-alpine 只提供 Alpine chroot 的 aarch64 模拟；buildx 构建 arm64 镜像
    # 还需要 binfmt_misc 中注册 qemu-aarch64，否则 RUN 会报 exec format error。
    - name: Set up QEMU (binfmt for arm64)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ github.event.inputs.arg_registry || 'ghcr.io' }}
        username: ${{ github.event.inputs.arg_user || github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: false

    - name: Build image (linux/arm64)
      run: |
        IMAGE="${{ github.event.inputs.arg_registry || 'ghcr.io' }}/${{ github.event.inputs.arg_user || github.actor }}/${{ github.event.inputs.arg_name || 'opencode-free-provider:latest' }}"
        SUFFIX="${{ github.event.inputs.arg_suffix }}"

        # 在标签后追加架构后缀：opencode-free-provider:latest -> opencode-free-provider:latest-aarch64
        if [ -n "$SUFFIX" ]; then
          case "$IMAGE" in
            *:*) NAME="${IMAGE%:*}"; TAG="${IMAGE##*:}" ;;
            *)   NAME="$IMAGE"; TAG="latest" ;;
          esac
          IMAGE="${NAME}:${TAG}${SUFFIX}"
        fi

        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        docker buildx build . \
          --platform linux/arm64 \
          --load \
          -t "$IMAGE"

    - name: Verify image architecture
      run: |
        docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}'
        test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = "arm64"

    - name: Smoke test
      run: docker run --rm --platform linux/arm64 "$IMAGE" bun -e 'console.log(process.platform, process.arch)'

    - name: Push image
      run: docker push "$IMAGE"
